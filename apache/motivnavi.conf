# Motivnavi OS - About 用 Apache 追加設定

ServerName localhost
AddDefaultCharset UTF-8

# 存在しないページは独自の404ページを表示
ErrorDocument 404 /404.html

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# PWA 用 MIME タイプ
AddType application/manifest+json .webmanifest
AddType image/webp .webp
AddType text/javascript .js

# 圧縮
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/manifest+json image/svg+xml
</IfModule>

# キャッシュ制御
<IfModule mod_headers.c>
    # Service Worker とページ本体は常に最新を確認
    <FilesMatch "^(sw\.js|index\.html|404\.html|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <Files "sw.js">
        Header set Service-Worker-Allowed "/"
    </Files>
    # 画像は 7 日キャッシュ
    <FilesMatch "\.(png|jpg|webp|ico)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
</IfModule>
